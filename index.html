<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzum Инкассация & Отчеты</title>
    <style>
        :root {
            --uzum-purple: #7C3AED;
            --uzum-purple-hover: #6D28D9;
            --uzum-dark-bg: #130F26;
            --uzum-card-bg: #1F193D;
            --uzum-input-bg: #2D2554;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --success-green: #10B981;
            --error-red: #EF4444;
            --badge-bg: #3B1B37;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--uzum-dark-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: var(--uzum-card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        h2, h3 {
            color: var(--text-main);
            margin-top: 0;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        h3 {
            font-size: 18px;
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        select, textarea, input[type="date"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid transparent;
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            background-color: var(--uzum-input-bg);
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        select:focus, textarea:focus, input[type="date"]:focus {
            border-color: var(--uzum-purple);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.3);
        }
        .status-group, .date-quick-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .status-btn, .quick-date-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .status-btn:active, .quick-date-btn:active {
            transform: scale(0.96);
        }
        .status-btn.active-yes {
            background: var(--success-green) !important;
            border-color: var(--success-green) !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        .status-btn.active-no {
            background: var(--error-red) !important;
            border-color: var(--error-red) !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }
        .quick-date-btn.active-date {
            background: var(--uzum-purple) !important;
            border-color: var(--uzum-purple) !important;
        }
        .submit-btn, .reset-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            color: white;
            transition: all 0.2s ease;
        }
        .submit-btn {
            background: var(--uzum-purple);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }
        .reset-btn {
            background: rgba(255,255,255,0.05);
            margin-top: 10px;
            color: var(--text-muted);
        }
        .filter-chips {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .chip {
            padding: 8px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
        }
        .chip span {
            background: rgba(255,255,255,0.15);
            padding: 1px 6px;
            border-radius: 10px;
            margin-left: 4px;
            font-size: 11px;
            color: white;
        }
        .chip.active-chip {
            background: var(--uzum-purple);
            color: white;
            border-color: var(--uzum-purple);
        }
        .debtors-container {
            background: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 15px;
            border-radius: 16px;
            margin-top: 15px;
        }
        .debtors-title {
            color: var(--error-red);
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .grid-pvz {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 220px;
            overflow-y: auto;
        }
        .pvz-tag {
            background: var(--badge-bg);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #FFA4A4;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }
        .grid-button, .tg-copy-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>

        </select>

        <label>Статус инкассации:</label>
        <div class="status-group">
            <button type="button" class="status-btn" id="btnYes" onclick="setFormStatus(true)">Сдано ✅</button>
            <button type="button" class="status-btn" id="btnNo" onclick="setFormStatus(false)">Не сдано ❌</button>
        </div>

        <label for="comment">Причина / Комментарий:</label>
        <textarea id="comment" rows="3" placeholder="Укажите причину, если ПВЗ не сдал кассу..."></textarea>
        <button class="submit-btn" onclick="sendData()">Сохранить в таблицу</button>
        <button class="reset-btn" onclick="resetAll()">Очистить форму</button>
    </div>

    <div class="container">
        <h3>📊 Мониторинг инкассации</h3>

        
        <label>Выбор даты отчёта:</label>
        <input type="date" id="reportDate" onchange="loadReport()">
        <div class="date-quick-group">
            <button class="quick-date-btn active-date" id="dateToday" onclick="setQuickDate('today')">Сегодня</button>
            <button class="quick-date-btn" id="dateYesterday" onclick="setQuickDate('yesterday')">Вчера</button>
        </div>

        <label style="margin-top:20px;">Фильтры по ПВЗ:</label>
        <div class="filter-chips">
            <div class="chip active-chip" id="chipAll" onclick="setFilter('all')">Все <span id="countAll">107</span></div>
            <div class="chip" id="chipDone" onclick="setFilter('done')">Сдали <span id="countDone">0</span></div>
            <div class="chip" id="chipNone" onclick="setFilter('none')">Не сдали <span id="countNone">107</span></div>
        </div>

        <div class="debtors-container">
            <div class="debtors-title">❌ Не внесли данные (<span id="countDebtors">107</span>)</div>
            <div class="grid-pvz" id="debtorsList"></div>
        </div>

        <button class="tg-copy-btn" onclick="copyForTelegram()">
            📋 Скопировать всё для Telegram
                   <script>
        let formStatus = null;
        let activeFilter = 'all';
        let secretClickCount = 0;
        
        const allPvzList = [
            "FrТАШ-160","FrТАШ-166","FrТАШ-167","FrТАШ-169","FrТАШ-171","FrТАШ-175","FrТАШ-176","FrТАШ-179","FrТАШ-181","FrТАШ-184","FrТАШ-185","FrТАШ-187","FrТАШ-188","FrТАШ-189","FrТАШ-192","FrТАШ-195","FrТАШ-196","FrТАШ-198","FrТАШ-200","FrТАШ-203","FrТАШ-205","FrТАШ-206","FrТАШ-208","FrТАШ-213","FrТАШ-215","FrТАШ-219","FrТАШ-220","FrТАШ-225","FrТАШ-227","FrТАШ-230","FrТАШ-232","FrТАШ-237","FrТАШ-239","FrТАШ-243","FrТАШ-247","FrТАШ-250","FrТАШ-251","FrТАШ-258","FrТАШ-261","FrТАШ-265","FrТАШ-266","FrТАШ-269","FrТАШ-271","FrТАШ-275","FrТАШ-277","FrТАШ-282","FrТАШ-283","FrТАШ-284","FrТАШ-285","FrТАШ-286","FrТАШ-287","FrТАШ-292","FrТАШ-293","FrТАШ-296","FrТАШ-297","FrТАШ-298","FrТАШ-304","FrТАШ-309","FrТАШ-310","FrТАШ-317","FrТАШ-318","FrТАШ-321","FrТАШ-322","FrТАШ-323","FrТАШ-325","FrТАШ-330","FrТАШ-331","FrТАШ-332","FrТАШ-333","FrТАШ-335","FrТАШ-336","FrТАШ-337","FrТАШ-338","FrТАШ-339","FrТАШ-341","FrТАШ-342","FrТАШ-347","FrТАШ-352","FrТАШ-353","FrТАШ-355","FrТАШ-365","FrТАШ-369","FrТАШ-370","FrТАШ-373","FrТАШ-376","FrТАШ-378","FrТАШ-379","FrТАШ-389","FrТАШ-393","FrТАШ-395","FrТАШ-397","FrТАШ-398","FrТАШ-401","FrТАШ-406","FrТАШ-407","FrТАШ-409","FrТАШ-411","FrТАШ-412","FrТАШ-414","FrТАШ-415","FrТАШ-417","FrТАШ-418","FrТАШ-419","FrТАШ-428","FrТАШ-429","FrТАШ-439","FrЧИН-9"
        ];

        let localSubmitted = JSON.parse(localStorage.getItem('uzum_inkas_data')) || {};

        window.onload = function() {
            const today = new Date().toISOString().split('T');
            document.getElementById('reportDate').value = today;
            
            const titleH3 = document.querySelector('h3');
            if (titleH3) {
                titleH3.style.cursor = 'pointer';
                titleH3.addEventListener('click', function() {
                    secretClickCount++;
                    if (secretClickCount === 3) {
                        globalSecretReset();
                        secretClickCount = 0;
                    }
                    setTimeout(() => { secretClickCount = 0; }, 2000);
                });
            }

            renderDebtors();
        };

        function setFormStatus(status) {
            formStatus = status;
            document.getElementById('btnYes').classList.toggle('active-yes', status);
            document.getElementById('btnNo').classList.toggle('active-no', !status);
        }

        function setQuickDate(mode) {
            const todayBtn = document.getElementById('dateToday');
            const yesterdayBtn = document.getElementById('dateYesterday');
            const dateInput = document.getElementById('reportDate');
            
            let targetDate = new Date();
            if(mode === 'yesterday') {
                targetDate.setDate(targetDate.getDate() - 1);
                yesterdayBtn.classList.add('active-date');
                todayBtn.classList.remove('active-date');
            } else {
                todayBtn.classList.add('active-date');
                yesterdayBtn.classList.remove('active-date');
            }
            dateInput.value = targetDate.toISOString().split('T');
            renderDebtors();
        }

        function loadReport() {
            document.getElementById('dateToday').classList.remove('active-date');
            document.getElementById('dateYesterday').classList.remove('active-date');
            renderDebtors();
        }

        function setFilter(type) {
            activeFilter = type;
            document.getElementById('chipAll').classList.toggle('active-chip', type === 'all');
            document.getElementById('chipDone').classList.toggle('active-chip', type === 'done');
            document.getElementById('chipNone').classList.toggle('active-chip', type === 'none');
            renderDebtors();
        }

        function renderDebtors() {
            const selectedDate = document.getElementById('reportDate').value;
            const container = document.getElementById('debtorsList');
            container.innerHTML = "";

            const submittedOnDate = localSubmitted[selectedDate] || [];
            let displayedPvz = [];
            
            if(activeFilter === 'all') { displayedPvz = allPvzList; } 
            else if(activeFilter === 'done') { displayedPvz = submittedOnDate; } 
            else { displayedPvz = allPvzList.filter(p => !submittedOnDate.includes(p)); }

            const currentDebtors = allPvzList.filter(p => !submittedOnDate.includes(p));

            document.getElementById('countAll').innerText = allPvzList.length;
            document.getElementById('countDone').innerText = submittedOnDate.length;
            document.getElementById('countNone').innerText = currentDebtors.length;
            document.getElementById('countDebtors').innerText = currentDebtors.length;

            displayedPvz.forEach(pvz => {
                const tag = document.createElement('div');
                tag.className = 'pvz-tag';
                if(submittedOnDate.includes(pvz)) {
                    tag.style.background = '#112F24';
                    tag.style.borderColor = 'rgba(16, 185, 129, 0.3)';
                    tag.style.color = '#A7F3D0';
                }
                tag.innerText = pvz;
                container.appendChild(tag);
            });
        }

        function resetAll() {
            document.getElementById('pvzSelect').value = "";
            document.getElementById('comment').value = "";
            formStatus = null;
            document.getElementById('btnYes').classList.remove('active-yes');
            document.getElementById('btnNo').classList.remove('active-no');
        }

        function sendData() {
            const pvz = document.getElementById('pvzSelect').value;
            const comment = document.getElementById('comment').value;
            const selectedDate = document.getElementById('reportDate').value;
            
            if(!pvz) { alert("Выберите ПВЗ!"); return; }
            if(formStatus === null) { alert("Выберите статус!"); return; }

            const webAppUrl = "https://google.com";
            const payload = { pvz: pvz, status: formStatus, comment: comment, totalSum: 0 };

            fetch(webAppUrl, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert("Данные успешно отправлены в Google Таблицу!");
                
                if(formStatus === true) {
                    if(!localSubmitted[selectedDate]) localSubmitted[selectedDate] = [];
                    if(!localSubmitted[selectedDate].includes(pvz)) localSubmitted[selectedDate].push(pvz);
                    localStorage.setItem('uzum_inkas_data', JSON.stringify(localSubmitted));
                }
                
                renderDebtors();
                resetAll();
            })
            .catch(error => { alert("Ошибка отправки: " + error); });
        }

        function globalSecretReset() {
            let pass = prompt("Введите пароль администратора для полного сброса системы:");
            if (pass === "1111") {
                if (confirm("ВНИМАНИЕ! Это действие сотрет ВСЕ данные за этот день на сайте и в Google Таблице. Продолжить?")) {
                    const webAppUrl = "https://google.com";
                    
                    fetch(webAppUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({ action: "CLEAR_ALL" })
                    })
                    .then(() => {
                        const selectedDate = document.getElementById('reportDate').value;
                        localSubmitted[selectedDate] = [];
                        localStorage.setItem('uzum_inkas_data', JSON.stringify(localSubmitted));
                        renderDebtors();
                        alert("Система успешно обнулена!");
                    });
                }
            } else {
                alert("Неверный пароль!");
            }
        }

        // ОБНОВЛЕННАЯ ФУНКЦИЯ: КОПИРУЕТ И ТЕХ КТО СДАЛ, И ТЕХ КТО НЕ СДАЛ
        function copyForTelegram() {
            const selectedDate = document.getElementById('reportDate').value;
            const submittedOnDate = localSubmitted[selectedDate] || [];
            const debtors = allPvzList.filter(p => !submittedOnDate.includes(p));

            let text = `📊 *ОТЧЕТ ПО ИНКАССАЦИИ ЗА ${selectedDate}*\n\n`;

            // 1. Блок сдавших
            text += `✅ *Сдали инкассацию (${submittedOnDate.length}):*\n`;
            if (submittedOnDate.length > 0) {
                text += submittedOnDate.join(', ') + '\n\n';
            } else {
                text += 'Пока никто не сдал\n\n';
            }

            // 2. Блок не сдавших
            text += `🔴 *Не сдали инкассацию (${debtors.length}):*\n`;
            if (debtors.length > 0) {
                text += debtors.join(', ') + '\n';
            } else {
                text += 'Все ПВЗ успешно сдали! 🎉\n';
            }

            var dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = text; 
            dummy.select(); 
            document.execCommand("copy");
            document.body.removeChild(dummy);
            alert("Полный отчет (Сдали + Не сдали) скопирован в буфер обмена!");
        }
    </script>
</body>
</html>
