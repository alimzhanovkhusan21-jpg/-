<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzum Инкассация & Отчеты</title>
    <style>
        :root {
            --uzum-purple: #7C3AED;
            --uzum-purple-hover: #6D28D9;
            --uzum-dark-bg: #130F26;
            --uzum-card-bg: #1F193D;
            --uzum-input-bg: #2D2554;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --success-green: #10B981;
            --error-red: #EF4444;
            --badge-bg: #3B1B37;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--uzum-dark-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: var(--uzum-card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        h2, h3 {
            color: var(--text-main);
            margin-top: 0;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        h3 {
            font-size: 18px;
            text-align: left;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, textarea, input[type="date"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid transparent;
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            background-color: var(--uzum-input-bg);
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        select:focus, textarea:focus, input[type="date"]:focus {
            border-color: var(--uzum-purple);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.3);
        }
        .status-group, .date-quick-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .status-btn, .quick-date-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .status-btn:active, .quick-date-btn:active {
            transform: scale(0.96);
        }
        .status-btn.active-yes {
            background: var(--success-green) !important;
            border-color: var(--success-green) !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        .status-btn.active-no {
            background: var(--error-red) !important;
            border-color: var(--error-red) !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }
        .quick-date-btn.active-date {
            background: var(--uzum-purple) !important;
            border-color: var(--uzum-purple) !important;
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            background: var(--uzum-purple);
            color: white;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }
        .submit-btn:hover {
            background: var(--uzum-purple-hover);
        }
        
        /* СТИЛИ ПАНЕЛИ ОТЧЕТОВ */
        .filter-chips {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .chip {
            padding: 8px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-muted);
            transition: 0.2s;
        }
        .chip span {
            background: rgba(255,255,255,0.15);
            padding: 1px 6px;
            border-radius: 10px;
            margin-left: 4px;
            font-size: 11px;
            color: white;
        }
        .chip.active-chip {
            background: var(--uzum-purple);
            color: white;
            border-color: var(--uzum-purple);
        }
        .debtors-container {
            background: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 15px;
            border-radius: 16px;
            margin-top: 15px;
        }
        .debtors-title {
            color: var(--error-red);
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .grid-pvz {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .pvz-tag {
            background: var(--badge-bg);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #FFA4A4;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }
        .tg-copy-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .tg-copy-btn:hover {
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <!-- БЛОК ВВОДА ДАННЫХ -->
    <div class="container">
        <h2>Инкассация ПВЗ</h2>
        
        <label for="pvzSelect">Выберите ПВЗ:</label>
        <select id="pvzSelect">
            <option value="">-- Выберите ПВЗ --</option>
